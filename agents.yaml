# agents.yaml
# Declarative configuration for the multi-agent system.
# Add or edit agents here without changing the orchestration code.
#
# Keys understood by agents/registry.py and agents/orchestrator.py:
#   name        unique id; also the key its result is stored under on the blackboard
#   type        which class to build (see agents/registry.py).
#               Defaults to name, then to the generic WorkerAgent.
#   role        natural language description, used in prompts
#   model       model id passed to the agent
#   tools       tool names the agent is allowed to use
#   depends_on  agents that must run first; used to topologically sort the run
#   options     free-form per-agent settings (file paths, thresholds, ...)
#   enabled     set to false to skip the agent entirely

orchestrator:
  name: orchestrator
  role: Coordinates tasks and delegates work to specialized worker agents
  model: gpt-4o-mini
  max_iterations: 10

agents:
  # --- intake: independent, can run in any order ---------------------------
  - name: schedule_reader
    type: schedule_reader
    role: Reads applicant availability and extracts structured schedule data
    model: gpt-4o-mini
    tools: [file_reader]
    depends_on: []
    options:
      path: data/applicants.csv

  - name: resume_reader
    type: resume_reader
    role: Parses resumes into structured candidate records
    model: gpt-4o-mini
    tools: [file_reader]
    depends_on: []
    options:
      path: data/resumes

  # --- validation and reasoning --------------------------------------------
  - name: crn_checker
    type: crn_checker
    role: Validates the CRN on each candidate record
    model: gpt-4o-mini
    tools: []
    depends_on: [resume_reader]
    options:
      source: resume_reader
      # Placeholder format - confirm the real one before relying on this.
      pattern: "^CRN-[0-9]{6}$"

  - name: suggestion_agent
    type: suggestion_agent
    role: Recommends candidates using CRN verdicts and availability
    model: gpt-4o-mini
    tools: []
    depends_on: [crn_checker, schedule_reader]
    options:
      crn_source: crn_checker
      schedule_source: schedule_reader
      # Set to true to have the model write the rationale. Needs OPENAI_API_KEY.
      explain: false

  # --- rendering: expensive, opt in explicitly ------------------------------
  - name: visualizer
    type: visualizer
    role: Renders the suggested schedule as a viewable artifact
    model: gpt-4o-mini
    tools: []
    depends_on: [suggestion_agent]
    enabled: false
    options:
      source: suggestion_agent
      output_dir: runs
      write: false

  # --- generic placeholders left from the starter template ------------------
  - name: researcher
    role: Gathers information and context needed to complete a task
    model: gpt-4o-mini
    tools: [web_search, document_reader]
    depends_on: []

  - name: coder
    role: Writes, reviews, and edits code based on the task requirements
    model: gpt-4o-mini
    tools: [code_interpreter, file_editor]
    depends_on: [researcher]

  - name: reviewer
    role: Reviews outputs from other agents for quality and correctness
    model: gpt-4o-mini
    tools: [code_interpreter]
    depends_on: [coder, suggestion_agent]

communication:
  protocol: message_passing
  shared_memory: true
  max_message_length: 4000

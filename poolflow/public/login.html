<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - PoolFlow</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">Pool<span>Flow</span></a>
    </div>
  </header>

  <main id="main">
    <div class="wrap narrow stack">
      <div class="card">
        <h1>Sign in</h1>
        <p class="muted">Use the account set up for your business.</p>

        <div id="login-notice" class="hidden"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username"
                   inputmode="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
          </div>
          <button id="login-submit" type="submit">Sign in</button>
        </form>
      </div>

      <p class="faint center">
        Accounts are created for each business during setup, so there is no sign-up form here
        yet. Ask whoever set up your PoolFlow to add you.
      </p>
    </div>
  </main>
</body>
</html>

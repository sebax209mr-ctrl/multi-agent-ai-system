# This workflow installs Python dependencies, lints, and runs tests for the
# multi-agent-ai-system project across the supported Python versions.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  # Run on every pull request, whatever it targets. Restricting this to "main"
  # meant stacked pull requests (one feature branch based on another) silently
  # got no CI at all.
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all other issues as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate agents.yaml
        run: |
          python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('agents.yaml').read_text())"

      - name: Test with pytest
        run: |
          if [ -n "$(find . -name 'test_*.py' -o -name '*_test.py' | head -n 1)" ]; then
            pytest -q
          else
            echo "No test files found - skipping pytest."
          fi
